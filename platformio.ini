[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 133000000L
extra_scripts = pre:scripts/build_stamp.py
upload_protocol = picotool
monitor_speed = 115200
monitor_port = COM5
; pio device list => USB Port suchen


lib_deps =
    https://github.com/RudolphRiedel/FT800-FT813/archive/refs/heads/5.x.zip



build_flags =
    ; Main readings and numeric UI fields use snprintf with %f.
    ; Match Arduino-Pico's Arduino IDE link flags for newlib-nano.
    -Wl,-u,_printf_float
    ; EVE 5.x uses Mbed's renamed SDK SPI initializer on RP2040.
    -D _spi_init=spi_init
    ; Temporary touch/render timing diagnostics; 0 compiles them out completely.
    -D ASMU_UI_TIMING=1
    ; Display: Riverdi RVT50 / 800x480
    -D EVE_RVT50
 

    ; EVE control pins
    -D EVE_CS=17
    -D EVE_PDN=20

    ; Mainboard CN4: SPI1 on RP2040 Pico
    -D EVE_SPI=spi1
    -D EVE_SCK=14
    -D EVE_MOSI=15
    -D EVE_MISO=12

    ; Allow warm restart while DISP_PD_N is not connected
    -D EVE_SOFT_RESET

    ; Display orientation
    -D EVE_ROTATE=0
