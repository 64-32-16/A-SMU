[env:pico]
platform = raspberrypi
board = pico
framework = arduino
upload_protocol = picotool
monitor_speed = 115200
monitor_port = COM5
; pio device list => USB Port suchen


lib_deps =
    https://github.com/RudolphRiedel/FT800-FT813/archive/refs/heads/5.x.zip



build_flags =
    ; Display: Riverdi RVT50 / 800x480
    -D EVE_RVT50
 

    ; EVE control pins
    -D EVE_CS=17
    -D EVE_PDN=20

    ; Mainboard CN4: SPI1 on RP2040 Pico
    -D EVE_SPI=spi1
    -D EVE_SCK=14
    -D EVE_MOSI=15
    -D EVE_MISO=12

    ; Allow warm restart while DISP_PD_N is not connected
    -D EVE_SOFT_RESET

    ; Display orientation
    -D EVE_ROTATE=0
